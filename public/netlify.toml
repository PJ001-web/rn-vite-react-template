# Netlify configuration for the Resilience Nexus site
# This folder is 100% static — no build step required.

[build]
  publish = "."

# Serve pages without the .html extension (e.g. /team instead of /team.html)
# and keep existing links working.
[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 301

# Sensible default security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Long-cache static assets (images, logo)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
