<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Resilience Nexus</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            color: #333;
        }
        h1 { color: #1a1a2e; }
        form { display: flex; flex-direction: column; gap: 16px; }
        label { font-weight: 600; margin-bottom: 4px; display: block; }
        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        textarea { min-height: 120px; resize: vertical; }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #999; cursor: not-allowed; }
        .form-status {
            padding: 12px 16px;
            border-radius: 6px;
            display: none;
        }
        .form-status.success { background: #d1fae5; color: #065f46; display: block; }
        .form-status.error { background: #fee2e2; color: #991b1b; display: block; }
        .cf-turnstile { margin-top: 4px; }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <p>Have a question or want to get in touch? Fill out the form below and we will get back to you.</p>

    <div id="form-status" class="form-status"></div>

    <form id="contact-form" action="/api/contact" method="POST">
        <div>
            <label for="name">Name *</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div>
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject">
        </div>
        <div>
            <label for="message">Message *</label>
            <textarea id="message" name="message" required></textarea>
        </div>
        <div class="cf-turnstile" data-sitekey="data-sitekey="0x4AAAAAAEAwMcPh2G9UtI7y"></div>
        <button type="submit" id="submit-btn">Send Message</button>
    </form>

    <script>
        var form = document.getElementById('contact-form');
        var statusEl = document.getElementById('form-status');
        var submitBtn = document.getElementById('submit-btn');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            statusEl.className = 'form-status';
            statusEl.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                var formData = new FormData(form);
                var res = await fetch('/api/contact', {
                    method: 'POST',
                    body: formData,
                });
                var data = await res.json();

                if (data.success) {
                    statusEl.className = 'form-status success';
                    statusEl.textContent = data.message || 'Your message has been sent!';
                    form.reset();
                } else {
                    statusEl.className = 'form-status error';
                    statusEl.textContent = data.error || 'Something went wrong. Please try again.';
                }
            } catch (err) {
                statusEl.className = 'form-status error';
                statusEl.textContent = 'Network error. Please try ago.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Message';
            }
        });
    </script>
</body>
</html>
